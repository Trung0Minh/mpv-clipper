name: Build and test
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ pkg-config qt6-base-dev libqt6opengl6-dev libmpv-dev mpv ffmpeg xvfb libgl1-mesa-dri
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j 2
      - name: Test
        run: xvfb-run -a -s '-screen 0 1280x1024x24' ctest --test-dir build --output-on-failure
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          QT_QPA_PLATFORM: xcb
      - name: Package
        run: cd build && cpack -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: mpv-clipper-linux
          path: build/mpv-clipper-*.tar.gz
